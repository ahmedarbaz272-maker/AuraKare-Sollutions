name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL Actions secret"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Missing SUPABASE_ANON_KEY Actions secret"; exit 1; }

          mkdir -p dist
          cp about-AuraKare_Sollutions.html ai-ready-processing.html bpo-workflows.html data-security.html document-scanning.html get-in-touch.html index.html legacy-data-transformation.html privacy-policy.html sectors.html style.css script.js sitemap.xml robots.txt GoogleBrand.png ak-favicon.png ak-favicon.ico apple-touch-icon.png cta-banner.svg dist/
          cp -R Assets dist/Assets
          printf '%s\n' 'aurakaresollutions.com' > dist/CNAME

          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            url: process.env.SUPABASE_URL,
            anonKey: process.env.SUPABASE_ANON_KEY,
          };
          fs.writeFileSync(
            'dist/supabase-config.js',
            `window.supabaseConfig = ${JSON.stringify(config)};\n`,
          );
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
